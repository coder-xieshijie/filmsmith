<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>phosphor</title>
    <script src="lib/vendor/gsap.min.js"></script>
    <!-- fonts come from fonts.json via `npm run setup`; film.js waits for lib/text.js fontsReady(), which
         banners and fails the check when a face is missing -->
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <style>
      /* colours come from palettes.js (film.js writes them onto :root) */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: var(--ink); background: var(--bg); font-optical-sizing: auto; }
      .mono { font-family: "JetBrains Mono", monospace; }
      .disp { font-family: "Inter", sans-serif; font-weight: 800; letter-spacing: -0.045em; line-height: 0.95; font-variation-settings: "opsz" 32; }
      .abs { position: absolute; }
      .a { opacity: 0; }
      .g { color: var(--accent); }
      .ink { color: var(--ink); }
      .m { color: var(--muted); }
      .d { color: var(--dim); }
      .stripe { -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 4px, rgba(0,0,0,0.62) 4px 6px); mask-image: repeating-linear-gradient(to bottom, #000 0 4px, rgba(0,0,0,0.62) 4px 6px); }
      .sw { background: linear-gradient(180deg, var(--titleHi) 10%, var(--titleLo) 95%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .sg { background: linear-gradient(180deg, var(--hi) 0%, var(--accent) 45%, var(--deep) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .rgb { --gx: 0px; --ga: 0; }
      .rgb:not(.abs) { position: relative; }
      .rgb::before, .rgb::after { content: attr(data-text); position: absolute; left: 0; top: 0; white-space: pre; -webkit-text-fill-color: currentColor; background: none; opacity: var(--ga); pointer-events: none; }
      .rgb::before { color: var(--bad); transform: translateX(var(--gx)); mix-blend-mode: screen; }
      .rgb::after { color: var(--key); transform: translateX(calc(var(--gx) * -1)); mix-blend-mode: screen; }
      .cur { display: inline-block; width: 0.5em; height: 1.05em; background: var(--ink); vertical-align: -0.17em; margin-left: 0.12em; }

      /* background stack */
      #bgfield { position: absolute; inset: 0; background: radial-gradient(1200px 800px at 50% 45%, var(--bgHi) 0%, var(--bg) 55%, var(--bgLo) 100%); }
      #grid { position: absolute; inset: -160px; background-image: linear-gradient(to right, rgba(var(--a-rgb),0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(var(--a-rgb),0.05) 1px, transparent 1px); background-size: 160px 160px; }
      #crosses { position: absolute; inset: 0; }
      #glowball { position: absolute; left: 560px; top: 140px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--a-rgb),0.11), rgba(var(--a-rgb),0) 65%); }
      #scan { position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px); pointer-events: none; z-index: 45; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(1500px 950px at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%); z-index: 44; pointer-events: none; }
      #grain { position: absolute; inset: 0; z-index: 46; pointer-events: none; mix-blend-mode: overlay; opacity: 0.5; }
      #flash { position: absolute; inset: 0; background: var(--hi); opacity: 0; z-index: 50; pointer-events: none; }
      #endDim { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 49; pointer-events: none; }
      #tears { position: absolute; inset: 0; z-index: 48; pointer-events: none; }
      #tears i { position: absolute; left: 0; width: 100%; height: 0; background: rgba(var(--a-rgb),0.5); opacity: 0; display: block; }
      /* screen variant `flat` (content.screen; mode card, Variants): a flat panel has no raster lines, no
         striped type and no edge fall-off. The default `crt` adds no class and is unchanged. */
      #root.screen-flat #scan, #root.screen-flat #vignette { display: none; }
      #root.screen-flat .stripe { -webkit-mask-image: none; mask-image: none; }

      /* HUD */
      #hud { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
      .corner { position: absolute; width: 34px; height: 34px; border: 0 solid rgba(var(--muted-rgb),0.45); z-index: 31; }
      .corner.tl { left: 38px; top: 34px; border-left-width: 2px; border-top-width: 2px; }
      .corner.tr { right: 38px; top: 34px; border-right-width: 2px; border-top-width: 2px; }
      .corner.bl { left: 38px; bottom: 34px; border-left-width: 2px; border-bottom-width: 2px; }
      .corner.br { right: 38px; bottom: 34px; border-right-width: 2px; border-bottom-width: 2px; }
      #brand { position: absolute; left: 70px; top: 38px; display: flex; align-items: center; gap: 12px; font-size: 25px; color: var(--muted); white-space: pre; }
      #brand b { color: var(--ink); font-weight: 500; }
      #lic { position: absolute; right: 74px; top: 42px; font-size: 25px; letter-spacing: 0.18em; color: var(--muted); display: flex; align-items: center; gap: 12px; white-space: pre; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
      #sect { position: absolute; left: 74px; bottom: 42px; font-size: 25px; letter-spacing: 0.12em; color: var(--muted); white-space: pre; }
      #prog { position: absolute; left: 0; bottom: 0; height: 4px; width: 1920px; background: linear-gradient(90deg, rgba(var(--muted-rgb),0.2), var(--muted)); transform-origin: 0 50%; }

      .scene { position: absolute; inset: 0; z-index: 5; visibility: hidden; }
      .shot { position: absolute; pointer-events: none; }
      .shot canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

      /* shared page chrome */
      .ph { left: 110px; top: 92px; font-size: 150px; white-space: pre; transform-origin: 0 0; }
      .ph span { display: inline-block; }
      .ph .mbr, .ph .mbu { display: inline-block; white-space: pre; }
      .psub { left: 112px; top: 192px; font-size: 25px; color: var(--muted); white-space: pre; }
      .card-num { left: 0; width: 1920px; top: 366px; text-align: center; font-size: 32px; letter-spacing: 0.3em; color: var(--muted); }
      .card-sub { left: 0; width: 1920px; top: 640px; text-align: center; font-size: 32px; color: var(--muted); white-space: pre; }
      .win { position: absolute; border: 2px solid var(--line); background: rgba(var(--panel-rgb), 0.88); border-radius: 10px; overflow: hidden; }
      .win .bar { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 2px solid var(--line); font-size: 25px; color: var(--muted); white-space: pre; }
      .win .bar i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: inline-block; flex: none; }
      .win .bar .r { margin-left: auto; color: var(--muted); }
      .strip { left: 112px; top: 948px; font-size: 25px; color: var(--muted); white-space: pre; }
      .strip b { color: var(--dim); font-weight: 400; }
      .chip { padding: 8px 22px; border: 2px solid var(--line); border-radius: 6px; font-size: 40px; color: var(--muted); white-space: pre; }
      .chip.on { color: var(--bg); background: var(--ink); border-color: var(--ink); }
      .tag { padding: 10px 18px; font-size: 25px; letter-spacing: 0.08em; white-space: pre; border: 2px solid; border-radius: 4px; }
      .tag.bad { color: var(--bad); border-color: rgba(var(--bad-rgb),0.55); background: rgba(var(--bad-rgb),0.08); }
      .tag.good { color: var(--hi); border-color: rgba(var(--a-rgb),0.6); background: rgba(var(--a-rgb),0.1); box-shadow: 0 0 18px rgba(var(--a-rgb),0.25); }
      .flag { position: absolute; padding: 6px 16px; font-size: 40px; border-radius: 4px; white-space: pre; border: 2px solid rgba(var(--find-rgb),0.65); color: var(--find); background: rgba(var(--panel-rgb),0.95); }
      .code { position: absolute; left: 28px; font-size: 25px; line-height: 1; white-space: pre; color: var(--ink); }
      .code .h { color: var(--ink); font-weight: 700; }
      .code .k { color: var(--ink); font-weight: 700; }
      .code .p { color: var(--dim); }
      .node { position: absolute; border: 2px solid var(--line); background: rgba(var(--panel-rgb),0.92); border-radius: 8px; display: flex; align-items: center; gap: 18px; padding: 0 24px; }
      .nt { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); white-space: pre; font-variation-settings: "opsz" 32; }
      .ns { font-size: 25px; color: var(--muted); margin-top: 4px; white-space: pre; }
      .st { position: absolute; right: 20px; top: 18px; width: 14px; height: 14px; border-radius: 50%; background: var(--line); }

      /* boot */
      .boot-p { left: 0; width: 1920px; text-align: center; font-size: 50px; color: var(--muted); white-space: pre; }
      .boot-q { left: 0; width: 1920px; text-align: center; white-space: pre; color: var(--ink); }
      .boot-q span.c { display: inline-block; white-space: pre; }
      .boot-tags { left: 0; width: 1920px; display: flex; justify-content: center; gap: 20px; }

      /* audit (legacy opening) */
      .audit-cmd { left: 200px; top: 150px; font-size: 32px; color: var(--accent); white-space: pre; }
      .row { position: absolute; left: 200px; width: 1520px; height: 150px; display: flex; align-items: center; border-bottom: 1px solid rgba(var(--muted-rgb),0.12); }
      .row .hl { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(var(--a-rgb),0.16), rgba(var(--a-rgb),0.03)); opacity: 0; }
      .row .idx { position: relative; width: 100px; font-size: 25px; color: var(--dim); }
      .row .word { position: relative; font-size: 108px; white-space: pre; }
      .row .tag { position: absolute; right: 0; font-size: 25px; padding: 12px 20px; }

      /* hero */
      /* the sphere's light layer (film.js lightLayer) does the screen blend over the ground; a blend set here,
         inside that layer, would meet only its transparent backdrop */
      .hero-wrap { left: -230px; top: 130px; width: 1440px; height: 810px; }
      .hero-wrap canvas { -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 34%, transparent 60%); mask-image: radial-gradient(circle at 50% 50%, #000 34%, transparent 60%); }
      .h1 { white-space: pre; }
      .hero-sub { font-size: 40px; line-height: 1.5; color: var(--muted); }
      .kv { font-size: 25px; white-space: pre; color: var(--ink); }
      .kv .k { color: var(--dim); display: inline-block; width: 170px; }

      /* qa */
      .q { position: absolute; left: 40px; width: 1620px; }
      .qt { font-size: 40px; color: var(--ink); white-space: pre; }
      .qt b { color: var(--dim); font-family: "JetBrains Mono", monospace; font-weight: 500; margin-right: 14px; }
      .chips { display: flex; gap: 20px; margin-top: 22px; padding-left: 84px; }
      .dec { position: absolute; left: 34px; right: 30px; font-size: 40px; color: var(--ink); white-space: pre; display: flex; gap: 14px; align-items: baseline; }
      .dec .ck { color: var(--muted); font-family: "JetBrains Mono", monospace; }
      .dec .id { color: var(--dim); font-family: "JetBrains Mono", monospace; }
      .found { font-size: 25px; align-self: center; color: var(--find); border: 1px solid rgba(var(--find-rgb),0.55); padding: 2px 8px; border-radius: 4px; font-family: "JetBrains Mono", monospace; }
      .confirm { left: 510px; top: 760px; width: 900px; height: 100px; border: 2px solid var(--muted); border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 40px; color: var(--ink); background: rgba(var(--muted-rgb),0.06); white-space: pre; }

      /* freeze */
      .scanner { position: absolute; left: 0; top: 0; width: 100%; height: 3px; background: var(--find); box-shadow: 0 0 22px var(--find); opacity: 0; }
      .lock { position: absolute; right: 18px; top: 66px; padding: 6px 14px; font-size: 25px; letter-spacing: 0.1em; border: 2px solid var(--accent); color: var(--hi); background: rgba(var(--a-rgb),0.14); border-radius: 4px; white-space: pre; }
      .fterm { left: 110px; top: 742px; width: 1700px; height: 176px; }
      .fterm .code { font-size: 25px; }
      .badge { position: absolute; right: 30px; top: 84px; font-size: 40px; color: var(--hi); border: 2px solid var(--accent); padding: 10px 20px; border-radius: 6px; background: rgba(var(--a-rgb),0.1); white-space: pre; }

      /* flow */
      .owner { flex-direction: column; justify-content: center; gap: 6px; border-color: var(--muted); }
      .sc { height: 64px; padding: 0 18px; display: flex; align-items: center; gap: 10px; font-size: 25px; border: 2px solid var(--line); border-radius: 6px; color: var(--muted); background: rgba(var(--panel-rgb),0.9); white-space: pre; }
      .sc .ok { color: var(--dim); font-family: "JetBrains Mono", monospace; }
      .envbox { top: 82px; height: 74px; border: 2px solid var(--line); border-radius: 8px; display: flex; align-items: center; padding: 0 26px; font-size: 25px; white-space: pre; background: rgba(var(--panel-rgb),0.9); }

      /* compare */
      .vcard { position: absolute; top: 250px; height: 380px; border: 2px solid var(--line); border-radius: 10px; background: rgba(var(--panel-rgb),0.9); padding: 30px 32px; }
      .vcard .lab { font-size: 25px; letter-spacing: 0.2em; color: var(--dim); white-space: pre; }
      .vcard .nm { font-size: 50px; font-weight: 800; letter-spacing: -0.03em; margin-top: 14px; white-space: pre; font-variation-settings: "opsz" 32; }
      .vcard .ds { font-size: 25px; color: var(--muted); margin-top: 10px; white-space: pre; }
      .vcard ul { list-style: none; margin-top: 26px; }
      .vcard li { font-size: 25px; color: var(--ink); margin-top: 12px; white-space: pre; }
      .vcard li::before { content: "▸ "; color: var(--dim); }
      .bigN { left: 108px; top: 660px; font-size: 240px; white-space: pre; }
      .bigOf { top: 780px; font-size: 84px; white-space: pre; }
      .bigMeta { left: 980px; top: 770px; font-size: 25px; line-height: 1.7; color: var(--ink); white-space: pre; }
      .ticker { left: 0; top: 940px; width: 1920px; height: 40px; overflow: hidden; }
      .ticker > div { position: absolute; left: 0; top: 0; font-size: 25px; white-space: pre; color: var(--dim); }
      .ticker b { color: var(--accent); font-weight: 500; }

      /* ends */
      .ends-h { left: 0; width: 1920px; top: 150px; text-align: center; font-size: 108px; white-space: pre; }
      .ends-sub { left: 0; width: 1920px; top: 286px; text-align: center; font-size: 25px; color: var(--muted); white-space: pre; }
      .pn { position: absolute; top: 470px; height: 160px; border: 2px solid var(--line); border-radius: 8px; background: rgba(var(--panel-rgb),0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
      .pn .t { font-size: 25px; letter-spacing: 0.2em; color: var(--dim); white-space: pre; }
      .pn .v { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; white-space: pre; }
      .pn .s { font-size: 25px; color: var(--muted); white-space: pre; }
      .pn.you { border-color: var(--ink); }
      .pn.you .t { color: var(--ink); }
      .pn.you .s { color: var(--ink); }
      .lab-c { font-size: 25px; text-align: center; white-space: pre; }

      /* install */
      .in-h { left: 0; width: 1920px; top: 150px; text-align: center; font-size: 108px; white-space: pre; }
      .in-term { left: 300px; top: 330px; width: 1320px; height: 210px; }
      .step { position: absolute; top: 620px; width: 360px; height: 150px; border: 2px solid var(--line); border-radius: 8px; background: rgba(var(--panel-rgb),0.92); padding: 24px 22px; }
      .step .c { font-size: 25px; color: var(--muted); white-space: pre; }
      .step .l { font-size: 25px; color: var(--ink); margin-top: 16px; white-space: pre; }
      .step .n { position: absolute; right: 18px; top: 18px; font-size: 25px; color: var(--dim); }

      /* taglines */
      .pix { left: 0; width: 1920px; text-align: center; font-weight: 800; letter-spacing: 0.02em; white-space: pre; color: var(--accent);
        -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px), repeating-linear-gradient(to right, #000 0 46px, transparent 46px 50px); -webkit-mask-composite: source-in;
        mask-image: repeating-linear-gradient(to bottom, #000 0 9px, transparent 9px 13px), repeating-linear-gradient(to right, #000 0 46px, transparent 46px 50px); mask-composite: intersect;
        filter: drop-shadow(0 0 20px rgba(var(--a-rgb),0.45)); }
      .slit { left: 0; width: 1920px; overflow: hidden; }
      .slit .ln { position: absolute; left: 0; width: 1920px; height: 3px; background: var(--hi); box-shadow: 0 0 18px rgba(var(--a-rgb),0.9), 0 0 50px rgba(var(--a-rgb),0.5); }
      .slit .txt { position: absolute; left: 0; width: 1920px; display: flex; flex-direction: column; align-items: center; }
      .tl-line { white-space: pre; text-align: center; }
      .tl-line span { display: inline-block; white-space: pre; }

      /* end */
      .endName { font-size: 190px; white-space: pre; }
      .ec { padding: 16px 30px; border: 2px solid var(--line); border-radius: 4px; font-size: 32px; letter-spacing: 0.06em; color: var(--ink); background: rgba(var(--panel-rgb),0.85); white-space: pre; }
      .endUrl { left: 0; width: 1920px; top: 650px; height: 90px; display: flex; justify-content: center; align-items: center; gap: 22px; font-size: 64px; color: var(--ink); white-space: pre; }
      .endSub { left: 0; width: 1920px; top: 776px; text-align: center; font-size: 32px; color: var(--muted); white-space: pre; }
      .morphLine { position: absolute; background: var(--hi); box-shadow: 0 0 18px rgba(var(--a-rgb),0.9); }

      /* batch 4 pages: the morph shell, the pick's cells and frame, the scope's screen, the CRT's glow */
      .win.ghost { border-color: transparent; background: transparent; }
      .cell { position: absolute; border: 2px solid var(--line); border-radius: 10px; background: rgba(var(--panel-rgb),0.92); display: flex; align-items: center; justify-content: center; font-size: 50px; color: var(--ink); white-space: pre; }
      .rframe { position: absolute; border: 4px solid var(--ink); border-radius: 16px; pointer-events: none; }
      .pres { font-size: 40px; color: var(--ink); white-space: pre; }
      .reading { left: 60px; top: 84px; font-size: 84px; white-space: pre; }
      .grat { position: absolute; left: 0; top: 54px; width: 1696px; height: 542px; background-image: linear-gradient(to right, rgba(var(--muted-rgb),0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(var(--muted-rgb),0.1) 1px, transparent 1px); background-size: 157.6px 68px; background-position: 60px 0; }
      #crtGlow { position: absolute; z-index: 6; display: none; pointer-events: none; background: var(--hi); box-shadow: 0 0 18px rgba(var(--a-rgb),0.9), 0 0 50px rgba(var(--a-rgb),0.5); }
      /* hero: the sphere is cut by the horizon line at y 540; the line draws out from the centre */
      .hero-hz-mask { -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 538px, transparent 541px); mask-image: linear-gradient(to bottom, #000 0, #000 538px, transparent 541px); }
      .hero-hz { left: 0; width: 1920px; height: 2px; background: var(--hi); box-shadow: 0 0 18px rgba(var(--a-rgb),0.9), 0 0 50px rgba(var(--a-rgb),0.5); transform-origin: 50% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1920" data-height="1080">
      <div id="bgfield"></div>
      <div id="glowball"></div>
      <div id="grid"></div>
      <svg id="crosses" width="1920" height="1080"></svg>
      <div id="stage"></div>
      <div id="tears" data-layout-allow-overflow><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div id="hud" class="a">
        <div id="brand" class="mono"></div>
        <div id="lic" class="mono"></div>
        <div id="sect" class="mono"></div>
        <div id="prog"></div>
      </div>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div id="vignette"></div>
      <div id="scan"></div>
      <canvas id="grain" width="1920" height="1080"></canvas>
      <div id="endDim"></div>
      <div id="flash"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-track-index="20" data-volume="1"></audio>
    </div>
    <!-- the timeline registry; film.js (via lib/boot.js) registers window.__timelines.main once fonts are measured.
         data-duration above is the fitted length, stamped by `npm run fit` (lib/fit.mjs); never edit it by hand. -->
    <script>window.__timelines = window.__timelines || {};</script>
    <script type="module" src="film.js"></script>
  </body>
</html>
