<!doctype html>
<html><head><meta charset="utf-8"><title>hand-offs self-test</title></head>
<body>
<script type="module">
// selftest.html — for every hand-off (defaults, plus each stage or variant, plus an image file for the asset hand-offs): p = 0 paints exactly its `from` rest and
// p = 1 exactly its `to` rest (max channel difference 0); a frame drawn twice with other frames in between is identical
// (pure function of p), also with motion blur on; the defaults draw something; the landing is settled (the fastest point
// moves ≤ 2 px in the last frame; p = 1 itself is never blurred). Also reports how much of the frame changes one frame in
// from each end (a cut by design shows there) and the time per frame. Results in window.__selftest. Run: node run.mjs.
import { createHandoff, list } from '../index.js';

// the asset hand-offs also run on a real image file: asset.png, drawn in code by make-asset.mjs (LAYOUT there)
const image = await createImageBitmap(await (await fetch('asset.png')).blob());
const asset = (crop) => ({ image, crop });
const cell = (r, value, label) => ({ box: [442, 164 + 140 * r, 196, 132], glyph: [490, 212 + 140 * r, 100, 36], value, label });
const NEUTRAL = { ground: '#0D0E10', panel: '#17191D', line: '#30343B', ink: '#ECEDEE', dim: '#8E949C', accent: '#FF6452' };
const FRAMES = [[0, 0, 1600, 900], [0, 100, 1600, 900], [160, 0, 1440, 810], [0, 190, 1440, 810], [160, 190, 1440, 810]];
// a painter drawing the image as a page or pane: (ctx, dx, dy) shifted, or (ctx, off) scrolled; `x` moves it across
const pageOf = (x) => (ctx, a = 0, b = 0) => {
  if (typeof b === 'object') { for (let k = 0; k < 4; k++) ctx.drawImage(image, 210, 54 + k * 1000 - a, 1500, 938); return; }   // section-lock page(ctx, off, P)
  ctx.fillStyle = '#F2F2EF'; ctx.fillRect(a, b, 1920, 1080); ctx.drawImage(image, 160 + x + a, 40 + b, 1600, 1000);
};
const ASSET_CASES = {
  'lift-out': { asset: asset(), cells: [cell(0, '48.0', 'First'), cell(1, '71.5', 'Second'), cell(4, '33.2', 'Fifth')] },
  'bezel-pullback': { asset: asset(), title: 'example.com/page' },
  'viewport-push': { asset: asset(), region: [420, 300, 400, 300], mark: cell(1).box },
  'spotlight-band': { asset: asset(), from: { band: [0, 160, 0, 140] }, to: { band: [0, 580, 0, 140] } },
  'value-carry': { from: { asset: asset(), box: cell(0).box, glyph: cell(0).glyph, value: '48.0' }, to: { asset: asset([300, 300, 900, 560]), glyph: cell(2).glyph, ring: cell(2).box } },
  'camera-truck': { items: [{ asset: asset(), w: 1300 }, { asset: asset([0, 160, 1600, 700]), w: 1300 }, { asset: asset([400, 0, 1200, 1000]), w: 1100 }], from: 0, to: 1 },
  'device-flip': { from: { asset: asset() }, to: { asset: asset([400, 160, 1200, 840]) } },
  'tether-link': { target: { asset: asset(), window: { x: 1000, y: null, w: 820 }, box: cell(1).box } },
  'mark-to-chrome': { logo: { asset: asset([60, 40, 360, 80]), from: { cx: 960, cy: 540, w: 1000 }, h: 30 }, content: { asset: asset() } },
  // added 2026-10-21: the same image as a long page (three copies stacked), frames (16:9 crops), sheets and panes
  'scroll-reel': { items: [{ asset: asset(), title: 'example.com/1' }, { asset: asset(), title: 'example.com/2' }, { asset: asset(), title: 'example.com/3' }], gap: 24,
    from: { item: 0, y: 0 }, to: { item: 2, y: 440, mark: cell(2).box }, sections: { heads: [0, 1, 2].map((item) => ({ item, y: 0, h: 160 })) } },
  'scroll-fling': { items: [{ asset: asset() }, { asset: asset() }, { asset: asset() }], from: { item: 2, y: 600 }, to: { item: 0, y: 0 },
    sections: { heads: [0, 1, 2].map((item) => ({ item, y: 0, h: 160 })) } },
  'section-lock': { page: pageOf(0), heads: [{ y: 0, h: 160 }, { y: 1000, h: 160 }, { y: 2000, h: 160 }], from: 0, to: 1060,
    tab: (ctx, i, y, P) => { ctx.drawImage(image, 0, 0, 1600, 160, P.view.x, y, P.view.w, 150); } },
  'unfold': { line: 420, height: 480, above: (ctx, P) => ctx.drawImage(image, 0, 0, 1600, 340, P.view.x, P.view.y, P.view.w, 366),
    below: (ctx, dy, P) => ctx.drawImage(image, 0, 340, 1600, 660, P.view.x, P.line + dy, P.view.w, 711),
    inside: (ctx, r, P) => ctx.drawImage(image, 400, 160, 960, 420, r.x + 270, r.y + 30, 960, 420) },
  'roll': { sheet: (ctx, bottom, P) => { ctx.save(); ctx.beginPath(); ctx.rect(P.x, 54, P.w, Math.max(0, bottom - 54)); ctx.clip(); ctx.drawImage(image, P.x, 54, P.w, 938); ctx.restore(); } },
  'feed-stack': { behind: [{ title: 'example.com/0' }], from: { asset: asset(), title: 'example.com/1' }, to: { asset: asset([0, 160, 1600, 840]), title: 'example.com/2' } },
  'strip-advance': { material: 'gate', frames: FRAMES.map((c, i) => ({ asset: asset(c), label: `frame ${i + 1}` })), from: 1, to: 3, curve: 'step', colors: NEUTRAL },
  'gate-punch': { image, crop: FRAMES[0] },
  'sheet-pick': { image, crop: FRAMES[1], small: { img: image, crop: FRAMES[1] }, rect: { x: 432, y: 400, w: 96, h: 54 } },
  'split-open': { from: { asset: asset(), title: 'example.com/table' }, to: { asset: asset([300, 160, 1300, 840]), title: 'example.com/detail' } },
  'louvre': { rows: [300, 440, 580, 720, 860], from: { asset: asset(), title: 'example.com/table' }, to: { asset: asset([300, 160, 1300, 840]), title: 'example.com/detail' } },
  'wipe-line': { from: { paint: pageOf(0) }, to: { paint: pageOf(400) } },
  'split-branch': { panes: (ctx, S) => { ctx.drawImage(image, 0, 0, 1600, 1000, 0, S.y, 1920, 1200); } },
  'diff-slider': { before: { paint: pageOf(0) }, after: { paint: pageOf(160) } },
  'type-window': { to: { asset: asset() } },
  'grid-hop': { tiles: FRAMES.map((c, i) => ({ asset: asset(c), label: `frame ${i + 1}` })), cols: 3, from: 0, to: 4 },
  'mosaic-assemble': { from: { asset: asset() }, to: { asset: asset([300, 160, 1300, 840]) }, origin: [540, 444] },
  'ticker-wipe': { from: { asset: asset(), label: 'EXAMPLE.COM / TABLE' }, to: { asset: asset([300, 160, 1300, 840]), label: 'EXAMPLE.COM / DETAIL' } },
  'parallax-slide': { items: [{ asset: asset(), title: 'example.com/a', index: '01', chip: ['First', '48.0'] }, { asset: asset([300, 160, 1300, 840]), title: 'example.com/b', index: '02', chip: ['Second', '71.5'] }] },
  'sheet-shuffle': { from: { asset: asset() }, to: { asset: asset([0, 160, 1600, 840]) } },
  'match-cut': { from: { asset: asset(), box: cell(1).glyph }, to: { asset: asset([300, 160, 1300, 840]), box: cell(3).glyph }, match: { cx: 960, cy: 540, h: 30 } },
};

const W = 1920, H = 1080;
const VARIANTS = {
  // a template drawing the line itself: `drawLine: false` / `line: false` leaves it out, a function draws it (here in ink)
  'rail-press': [{ phase: 'press' }, { phase: 'cut' }, { drawLine: false, label: 'drawLine false' },
    { drawLine: (ctx, b) => { ctx.fillStyle = '#EDEAE2'; ctx.fillRect(b.x, b.y, b.w, b.h); }, label: 'drawLine fn' }],
  'path-type': [{ line: false, label: 'line false' },
    { drawLine: (ctx, l) => { ctx.beginPath(); l.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.strokeStyle = '#EDEAE2'; ctx.lineWidth = 14; ctx.stroke(); }, label: 'drawLine fn' }],
  // lift-out as a hand-off into the next scene: the template draws the asset (`backdrop: false`), the cells land in its places
  'lift-out': [{ backdrop: false, view: { a: 0.75, bx: 210, by: 160 }, land: { font: { family: 'monospace', weight: 700 }, paperAlpha: 0, ink: '#EDEFF2', ring: false },
    cells: [{ box: [640, 184, 340, 138], glyph: [680, 222, 200, 62], value: '48.0', land: { x: 900, y: 700, w: 170, h: 42, cx: 985, baseline: 730, size: 25 } },
      { box: [640, 338, 340, 138], glyph: [680, 376, 200, 62], value: '71.5', land: { x: 900, y: 742, w: 170, h: 42, cx: 985, baseline: 772, size: 25 } }], label: 'land' }],
  'counter-portal': [{ glyph: { draw: 'counter' }, from: (ctx, P) => { ctx.fillStyle = P.colors.ink; ctx.fillRect(96, 900, 300, 90); }, label: 'glyph counter only' }],
  'arc-curl': [{ from: 'ring', to: 'node' }, { from: 'node', to: 'box' }, { from: 'ring', to: 'line' }],
  'stroke-reinterpret': [{ direction: 'remove' }],
  'net-unfold': [{ stage: 'unfold' }, { stage: 'arrange' }],
  're-encode': [{ direction: 'bars' }],
  'anchor-swap': [{ swap: 'iris' }, { swap: 'pull' }],
  'squash-to-path': [{ stage: 'squash' }, { stage: 'run' }, { stage: 'straighten' }],
  'field-morph': [{ step: 'quantize' }, { step: 'resolve' }],
  // added 2026-10-21: the options of the merged and material hand-offs
  'scroll-reel': [{ curve: 'momentum', pull: 0, chrome: false, scrollbar: false, label: 'momentum bare' },
    { sections: { heads: [0, 1200, 2400, 3600, 4800].map((y) => ({ y, h: 200 })) }, label: 'sections' },
    { page: (ctx, off, P, R) => { ctx.fillStyle = '#F2F2EF'; ctx.fillRect(R.x, R.y, R.w, R.h); ctx.fillStyle = '#9A9A96'; for (let y = Math.floor(off / 90) * 90; y < off + R.h; y += 90) ctx.fillRect(R.x + 60, R.y + y - off + 30, 400 + (y % 450), 26); },
      length: 6000, from: 0, to: 3000, label: 'page' }],
  'strip-advance': [{ curve: 'brake' }, { curve: 'step', cells: [1, 2, 3, 4, 5, 6].map((n) => ({ kind: 'title', text: String(n) })), from: 0, to: 3, label: 'step film' },
    { material: 'gate', colors: NEUTRAL, label: 'gate' }, { material: 'gate', curve: 'run', from: 5, to: 1, colors: NEUTRAL, label: 'gate run' },
    { marks: true, curve: 'brake', from: 2, to: 0, label: 'film marks' }],
  'gate-punch': [{ direction: 'out', ease: 'inOut' }],
  'split-open': [{ axis: 'y' }, { open: 0.5 }, { reveal: 'drawer', label: 'drawer window' }, { caret: { x: 400, y: 600, h: 52, w: 4 }, label: 'caret window' },
    { pane: { x: 900, y: 0, w: 1020, h: 1080 }, caret: { x: 520, y: 584, h: 52, w: 4 }, seam: { x: 900, y0: 0, y1: 1080 }, run: 0.43, to: { paint: (ctx, dx) => { ctx.fillStyle = '#3A4A5A'; ctx.fillRect(900 + dx + 60, 200, 900, 600); } }, label: 'pane caret drawer' },
    { pane: { x: 300, y: 100, w: 1320, h: 880 }, reveal: 'doors', from: { paint: (ctx, dx, dy) => { ctx.fillStyle = '#C9C9C4'; ctx.fillRect(300 + dx, 100 + dy, 1320, 880); } }, to: { paint: (ctx) => { ctx.fillStyle = '#3A4A5A'; ctx.fillRect(400, 200, 1120, 680); } }, label: 'pane doors' }],
  'louvre': [{ edge: 'seam', alternate: false, direction: -1, label: 'seam edge, one way' },
    { pane: { x: 900, y: 0, w: 1020, h: 1080 }, n: 9, stagger: 0.07, from: { paint: (ctx, dx) => { ctx.fillStyle = '#C9C9C4'; ctx.fillRect(900 + dx, 0, 1020, 1080); } }, to: { paint: (ctx, dx) => { ctx.fillStyle = '#3A4A5A'; ctx.fillRect(900 + dx, 0, 1020, 1080); } }, label: 'pane' },
    { pane: { x: 900, y: 0, w: 1020, h: 1080 }, n: 1, stagger: 0, from: { paint: (ctx, dx) => { ctx.fillStyle = '#C9C9C4'; ctx.fillRect(900 + dx, 0, 1020, 1080); } }, to: { paint: (ctx, dx) => { ctx.fillStyle = '#3A4A5A'; ctx.fillRect(900 + dx, 0, 1020, 1080); } }, label: 'pane push' }],
  'wipe-line': [{ dir: 'up' }, { dir: 'left' }, { dir: 'right' }],
};
const cases = list.flatMap((m) => [{ name: m.name, params: {} }, ...(VARIANTS[m.name] || []).map(({ label, ...v }) => ({ name: m.name, params: v, label: `${m.name} ${label ?? Object.values(v).join('/')}` })),
  ...(ASSET_CASES[m.name] ? [{ name: m.name, params: ASSET_CASES[m.name], label: `${m.name} image` }] : [])]);

const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d', { willReadFrequently: true }); };
const A = mk(), B = mk();
const grab = (ctx, fn) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H); fn(ctx); return ctx.getImageData(0, 0, W, H).data; };
const diff = (a, b) => {
  let max = 0, bad = 0;
  for (let i = 0; i < a.length; i += 4) {
    let d = 0;
    for (let k = 0; k < 4; k++) d = Math.max(d, Math.abs(a[i + k] - b[i + k]));
    if (d) bad++;
    if (d > max) max = d;
  }
  return { max, bad };
};
const same = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; };

const results = [];
for (const c of cases) {
  const r = { name: c.label || c.name };
  try {
    const h = await createHandoff(c.name, c.params);
    const dur = (h.beats * 60) / 120;
    const draw = (p, opts) => (ctx) => h.draw(ctx, p, opts);
    const f0 = grab(A, draw(0)), s0 = new Uint8ClampedArray(grab(B, (x) => h.still(x, 'from')));
    r.p0 = diff(f0, s0).max;
    const f1 = grab(A, draw(1)), s1 = new Uint8ClampedArray(grab(B, (x) => h.still(x, 'to')));
    r.p1 = diff(f1, s1).max;
    r.near0 = diff(grab(A, draw(1 / 300)), s0).bad;
    r.near1 = diff(grab(A, draw(1 - 1 / 300)), s1).bad;
    // the defaults draw something besides the ground
    const mid = new Uint8ClampedArray(grab(A, draw(0.5)));
    const g = mid.slice(0, 4);
    let drawn = 0;
    for (let i = 0; i < mid.length; i += 4) if (mid[i] !== g[0] || mid[i + 1] !== g[1] || mid[i + 2] !== g[2]) drawn++;
    r.drawn = drawn;
    grab(A, draw(0.2)); grab(A, draw(0.9));
    r.pure = same(mid, grab(A, draw(0.5)));
    // purity with motion blur, at the fastest of a few sampled p
    let pf = 0.5, vmax = -1;
    for (let k = 1; k < 20; k++) { const v = h.speed(k / 20, 1 / (60 * dur)); if (v > vmax) { vmax = v; pf = k / 20; } }
    const b1 = new Uint8ClampedArray(grab(A, draw(pf, { dur })));
    grab(A, draw(0.1, { dur }));
    r.blurPure = same(b1, grab(A, draw(pf, { dur })));
    // px the fastest point moves during the last frame before landing (≤ 2: nothing visibly still moving at the landing)
    r.endSpeed = h.speed(1, 1 / (30 * dur)) / (30 * dur);
    const t0 = performance.now();
    for (const p of [0.3, 0.5, 0.7]) grab(A, draw(p));
    r.ms = Math.round((performance.now() - t0) / 3);
    r.pass = r.p0 === 0 && r.p1 === 0 && r.pure && r.blurPure && r.drawn > 0 && r.endSpeed <= 2;
  } catch (e) {
    r.error = String(e && e.stack || e); r.pass = false;
  }
  results.push(r);
}
window.__selftest = { results, pass: results.every((r) => r.pass) };
document.title = window.__selftest.pass ? 'PASS' : 'FAIL';
</script>
</body></html>
