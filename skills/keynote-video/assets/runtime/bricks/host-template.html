<template>
  <style>
    #{{ID}} { position: absolute; inset: 0; overflow: hidden; }
    #{{ID}}-canvas, #{{ID}}-dom { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  </style>
  <div id="{{ID}}" data-composition-id="{{ID}}" data-width="1920" data-height="1080"
       data-composition-variables='[
         {"id":"lang","type":"enum","label":"Language","default":"en","options":[{"value":"en","label":"English"},{"value":"zh","label":"中文"}]},
         {"id":"palette","type":"string","label":"Look palette","default":"neutral-light"},
         {"id":"bpm","type":"number","label":"Tempo","default":120,"min":40,"max":240,"unit":"BPM"},
         {"id":"hold","type":"number","label":"Rest before and after","default":0.5,"min":0,"max":5,"unit":"s"},
         {"id":"surface","type":"string","label":"Surface (canvas | dom; empty: the brick’s first)","default":""},
         {"id":"params","type":"string","label":"Params (JSON)","default":"{}"}
       ]'>
    <canvas id="{{ID}}-canvas" width="1920" height="1080"></canvas>
    <div id="{{ID}}-dom" data-layout-ignore></div>
  </div>
  <script>
    // {{ID}} — HyperFrames host of the {{CATEGORY}} brick {{ID}}, written from bricks/host-template.html when the brick is
    // copied (copy.mjs). Mount it with data-composition-src="lib/bricks/{{CATEGORY}}/{{ID}}/host.html"; the brick and
    // lib/ resolve from the document.
    // One paused timeline drives one proxy value p: `hold` s at rest, the brick's beats at `bpm`, `hold` s at rest.
    // The film's `bpm` goes into the brick's params (a `bpm` in params wins), so its plan counts beats at the tempo it
    // plays at. `sample` is false in a film (optional slots the film leaves out are not drawn); the sample and check
    // tools set it true (the brick's own defaults are drawn).
    (async () => {
      const ID = '{{ID}}';
      const v = Object.assign({ lang: 'en', palette: 'neutral-light', bpm: 120, hold: 0.5, surface: '', params: '{}', sample: false },
        (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {});
      const params = { bpm: Number(v.bpm), ...(typeof v.params === 'string' ? JSON.parse(v.params || '{}') : v.params || {}) };
      const base = new URL('lib/bricks/', document.baseURI).href;
      const { createBrick } = await import(base + 'index.js');
      await Promise.all([...document.fonts].map((ff) => ff.load().catch(() => null)));   // every face in fonts.css, any look's
      for (const fam of ['Inter Tight', 'JetBrains Mono', 'Noto Sans SC']) for (const w of [400, 600, 700]) await document.fonts.load(w + ' 40px "' + fam + '"', '中文 Aa');
      await document.fonts.ready;
      document.documentElement.lang = v.lang === 'zh' ? 'zh-CN' : 'en';
      const b = await createBrick(ID, params, { lang: v.lang, palette: v.palette, category: '{{CATEGORY}}', bpm: Number(params.bpm), sample: v.sample === true || v.sample === 'true' });
      const surface = v.surface || (b.surface || ['canvas'])[0];
      const canvas = document.getElementById(ID + '-canvas'), dom = document.getElementById(ID + '-dom');
      canvas.style.display = surface === 'dom' ? 'none' : 'block';
      dom.style.display = surface === 'dom' ? 'block' : 'none';
      const ctx = canvas.getContext('2d');
      const dur = b.duration(Number(v.bpm)), hold = Number(v.hold);
      if (surface === 'dom') b.mount(dom); else b.warm?.();
      const show = (p) => { if (surface === 'dom') b.pose(p, { dur }); else { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, 1920, 1080); b.draw(ctx, p, { dur }); } };
      // one linear tween over the whole slot, so every seek (forward, back, in any worker) repaints from time alone
      const total = hold + dur + hold, s = { t: 0 };
      const at = (t) => Math.min(1, Math.max(0, (t - hold) / dur));
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(s, { t: 0 }, { t: total, duration: total, ease: 'none', onUpdate: () => show(at(s.t)) }, 0);
      show(0);
      window.__brickHosts = Object.assign(window.__brickHosts || {}, { [ID]: { duration: total, beats: b.beats } });
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
