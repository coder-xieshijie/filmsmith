<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>stream</title>
    <script src="lib/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <style>
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- data-duration is the fitted length, stamped by `npm run fit` (lib/fit.mjs); never edit it by hand.
         <html lang> is stamped from content.lang by `npm run setup` (tools/fonts.mjs). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1920" data-height="1080" data-fps="30">
      <div id="stage" data-layout-allow-overlap data-layout-allow-overflow></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="90" data-track-index="9"></audio>
    </div>
    <script>
      // lib/boot.js replaces this with the paused timeline that drives render(t) once fonts are ready
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // Hold the renderer until fonts are measured and the blocks are built (lib/boot.js settles this promise)
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildHold = window.__hf.buildHold || {};
      window.__hf.buildReady.main = new Promise((r) => (window.__hf.buildHold.main = r));
    </script>
    <script type="module">
      import { boot } from './lib/boot.js';
      import { fontsReady, errorBanner } from './lib/text.js';
      import { validate } from './timing.rules.js';
      import content from './content.js';

      let film;
      const problems = validate(content);
      try { film = await import('./film.js'); } catch (e) { problems.push(String(e?.message ?? e)); }
      if (problems.length) {
        console.error('[stream] ' + problems.join('\n'));
        errorBanner(['CONTENT.JS INVALID — run npm run fit', ...problems.slice(0, 8)], 'hf-content-error');
      }
      if (film) {
        document.documentElement.lang = film.plan.lang === 'zh' ? 'zh-Hans' : 'en';
        boot({ id: 'main', duration: film.duration, ready: async () => { await fontsReady(film.fonts); await film.ready(); }, render: (t) => film.render(t) });
      } else {
        const duration = Number(document.getElementById('root').dataset.duration) || 1;
        boot({ id: 'main', duration, render: () => {} });
      }
    </script>
  </body>
</html>
