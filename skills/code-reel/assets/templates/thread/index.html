<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>thread</title>
    <script src="lib/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <style>
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
      #grain { mix-blend-mode: overlay; opacity: 0.12; }
    </style>
  </head>
  <body>
    <!-- data-duration is the fitted length, stamped by lib/fit.mjs (npm run fit / audio / snapshot) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080" data-fps="30">
      <canvas id="film" class="layer" data-layout-allow-overflow></canvas>
      <canvas id="grain" class="layer"></canvas>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="40" data-track-index="9"></audio>
    </div>
    <script type="module">
      // Every frame is painted by film.js from t alone (hf-seek), WebGL for the two volume shots.
      // film.js imports lib/timing.js and ./timing.rules.js: scene starts, bars, bpm and duration come from
      // fit(content, rules), the same call score.mjs and lib/fit.mjs make.
      // lib/boot.js registers the paused timeline as window.__timelines.main once fonts and WebGL are ready.
      import { start } from './film.js';
      window.__timelines = window.__timelines || {};
      start();
    </script>
  </body>
</html>
