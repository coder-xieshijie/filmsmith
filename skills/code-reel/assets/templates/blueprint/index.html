<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>blueprint</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="lib/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <!-- data-duration is the fitted length: `npm run fit` (also run by audio and snapshot) stamps it from lib/timing.js fit() -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="48" data-width="1920" data-height="1080">
      <canvas id="film" class="clip" data-start="0" data-duration="48" data-track-index="0" data-layout-allow-overflow></canvas>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="48" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      // lib/boot.js registers the paused timeline as window.__timelines["main"] once fonts are ready
      window.__timelines = window.__timelines || {};
      // Hold the renderer until the drawing is built (fonts verified, every sheet measured, one or two worlds and the
      // hand-offs prepared; lib/boot.js settles this promise). Registered here, synchronously, because the renderer's
      // first readiness check can run before the module below (CONTRACT.md, "Slow setup holds the renderer").
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildHold = window.__hf.buildHold || {};
      window.__hf.buildReady.main = new Promise((r) => (window.__hf.buildHold.main = r));
    </script>
    <script type="module">
      import('./film.js').then(({ start }) => start());
    </script>
  </body>
</html>
