name: Bug report
description: A film fails to scaffold, fit, render or pass its checks, or renders wrong.
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - keynote-video
        - teach-video
    validations:
      required: true
  - type: input
    id: mode
    attributes:
      label: Style and palette (keynote-video) or style kit (teach-video)
      placeholder: "ink, cobalt"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected and what you got. Attach a still or the contact sheet for visual problems.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant part of the command output (for keynote-video, `npm run fit`, `npm run film` or `check-film`).
      render: text
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, FFmpeg version, and the skill's self-test output (for keynote-video, `node scripts/selftest.mjs --modes <mode>` in `skills/keynote-video`).
      render: text
    validations:
      required: true
